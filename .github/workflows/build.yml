name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 有設定 KEYSTORE_BASE64 / KEYSTORE_PASSWORD 兩個 Secrets 時，用固定簽章編譯正式版
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marian.jks"
            echo "MH_KEYSTORE=$RUNNER_TEMP/marian.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::未設定簽章 Secrets，改用 debug 簽章（每次編譯簽章不同）"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          MH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          if [ "$SIGNED" = "1" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/MarianHelper-v${VER}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "out/MarianHelper-v${VER}-debug.apk"
          fi
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MarianHelper-v${{ env.VER }}
          path: out/*.apk
